# Render Blueprint — deploy อัตโนมัติทุก git push
# ข้อมูลถาวรผ่าน Turso: ตั้ง env TURSO_URL + TURSO_TOKEN (ในหน้า Render dashboard)
#   ไม่ตั้ง = ข้อมูลรีเซ็ตทุก redeploy (demo)
#   ตั้งแล้ว = ถาวรบน Turso cloud ข้าม redeploy (รูปยังหาย เพราะเก็บใน uploads/ บน disk ephemeral)
services:
  - type: web
    name: lab-inventory
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build
    # init-db ถูกเรียกใน server.js แล้ว เพื่อใช้ Turso sync รอบเดียวตอน cold start
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      # ADMIN_PASS: ไม่ตั้ง = ใช้ default admin1234 จาก init-db
      # กรอกค่าจริง 2 ตัวนี้ในหน้า Render dashboard เพื่อเปิดโหมดถาวร (Turso)
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      # ---- SSO กับเว็บแลปหลัก (Firebase) ----
      # เปิดแล้ว (โหมดเปลี่ยนผ่าน): SSO ทำงาน แต่ยังให้ใช้งานแบบไม่ล็อกอินคู่กันไว้
      - key: FIREBASE_PROJECT_ID
        value: irish-lab
      # เปิดใช้จริงแล้ว: "0" = บังคับ login ทั้งเว็บ (ปุ่ม Equipment Loan บน irish-tech.com ส่ง token แล้ว)
      #    ตั้ง "0" แทนการลบ key เพราะลบออกจาก render.yaml แล้ว Render อาจคงค่าเดิม "1" ไว้บนเซิร์ฟ
      #    ถอยกลับ = เปลี่ยนเป็น "1" (คนไม่ล็อกอินใช้งานได้อีกครั้ง)
      - key: ALLOW_GUEST
        value: "0"
      - key: MAIN_SITE_URL
        value: https://irish-tech.com/en
      # endpoint โปรไฟล์ของเว็บหลัก (server-to-server) → role "admin" = admin คลัง, display_name = ชื่อผู้ยืม
      # ตอนนี้ใช้ /api/users/me (มีฟิลด์เกิน ฝั่งเราทิ้งเอง) · เว็บหลัก deploy /api/users/me/basic แล้วจะแจ้งให้เปลี่ยน
      - key: MAIN_SITE_PROFILE_URL
        value: https://irish-tech.com/api/users/me
      # (ไม่บังคับ) รายชื่ออีเมล admin คลังแบบกำหนดเอง เสริมจาก role ของเว็บหลัก
      - key: FIREBASE_ADMIN_EMAILS
        sync: false
