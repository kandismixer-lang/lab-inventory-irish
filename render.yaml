# Render Blueprint — deploy อัตโนมัติทุก git push
# ข้อมูลถาวรผ่าน Turso: ตั้ง env TURSO_URL + TURSO_TOKEN (ในหน้า Render dashboard)
#   ไม่ตั้ง = ข้อมูลรีเซ็ตทุก redeploy (demo)
#   ตั้งแล้ว = ถาวรบน Turso cloud ข้าม redeploy (รูปยังหาย เพราะเก็บใน uploads/ บน disk ephemeral)
services:
  - type: web
    name: lab-inventory
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build
    # init-db ถูกเรียกใน server.js แล้ว เพื่อใช้ Turso sync รอบเดียวตอน cold start
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      # ADMIN_PASS: ไม่ตั้ง = ใช้ default admin1234 จาก init-db
      # กรอกค่าจริง 2 ตัวนี้ในหน้า Render dashboard เพื่อเปิดโหมดถาวร (Turso)
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      # ---- SSO กับเว็บแลปหลัก (Firebase) ----
      # เปิดแล้ว (โหมดเปลี่ยนผ่าน): SSO ทำงาน แต่ยังให้ใช้งานแบบไม่ล็อกอินคู่กันไว้
      - key: FIREBASE_PROJECT_ID
        value: irish-lab
      # ⚠️ ลบ ALLOW_GUEST ออกเมื่อทีมเว็บหลักเปลี่ยนเมนู Equipment Loan เป็นปุ่มส่ง token แล้ว
      #    ลบเมื่อไหร่ = ทั้งเว็บบังคับ login ทันที · ถ้าลบก่อนที่ปุ่มเขาจะพร้อม ผู้ใช้จะติดวงกลม
      - key: ALLOW_GUEST
        value: "1"
      - key: MAIN_SITE_URL
        value: https://irish-tech.com/en
      # คนที่อยู่ใน collection นี้ของเว็บหลัก = admin ของคลัง
      - key: FIREBASE_MEMBER_COLLECTION
        value: member
      # ใส่ JSON ของ service account (ทั้งก้อน) เฉพาะกรณี security rules ไม่ยอมให้ผู้ใช้อ่าน collection member
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # รายชื่ออีเมล admin แบบกำหนดเอง (สำรอง/เสริมจาก collection member)
      - key: FIREBASE_ADMIN_EMAILS
        sync: false
