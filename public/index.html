<!doctype html>

    <title>คลัง IRiSH LAB</title>
    <meta name="theme-color" content="#000000" />
    <script>
      /* ตั้งธีมก่อน render กันจอกระพริบ (dark เป็นค่าเริ่มต้น) */
      (function () {
        var t = 'dark';
        try { var v = localStorage.getItem('theme'); if (v === 'light' || v === 'dark') t = v; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f4f5f7' : '#000000');
      })();
    </script>
